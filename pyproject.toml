[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bbarolo"
dynamic = ["version"]
description = "3D-Barolo (BBarolo): 3D tilted-ring fitting of emission-line datacubes"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Enrico Di Teodoro", email = "enrico.diteodoro@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.15",
    "astropy>=5.0",
    "numba>=0.57",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
bayesian = ["dynesty", "nautilus-sampler", "corner", "threadpoolctl"]
mpi = ["mpi4py", "schwimmbad"]
test = ["pytest"]

[project.scripts]
BBarolo = "bbarolo.cli:main"

[project.urls]
Homepage = "https://bbarolo.readthedocs.io"
Documentation = "https://bbarolo.readthedocs.io"
Source = "https://github.com/editeodoro/bbarolo2"
Issues = "https://github.com/editeodoro/bbarolo2/issues"
Changelog = "https://bbarolo.readthedocs.io/en/latest/reference/changes.html"

[tool.setuptools]
packages = ["bbarolo", "bbarolo.bayesian"]

[tool.setuptools.dynamic]
version = {attr = "bbarolo._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_BBB holds the author's own scripts, not tests
addopts = "--ignore=tests/test_BBB"
