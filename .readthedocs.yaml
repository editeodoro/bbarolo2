# Read the Docs: the documentation and website of BBarolo (docs/)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt
